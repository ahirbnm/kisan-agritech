<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kisan Agri Store</title>
<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f4f4f4;
}
header{
  background:#131921;
  color:white;
  display:flex;
  align-items:center;
  padding:10px 15px;
  gap:15px;
}
.logo{
  width:50px;
  height:50px;
  border-radius:8px;
  object-fit:cover;
}
.store-name{
  font-size:20px;
  font-weight:bold;
}
.search-container{
  flex:1;
  position:relative;
}
.search-bar{
  display:flex;
}
.search-bar input{
  width:100%;
  padding:8px;
  border:none;
  border-radius:4px 0 0 4px;
}
.search-bar button{
  padding:8px 12px;
  border:none;
  background:#febd69;
  cursor:pointer;
  border-radius:0 4px 4px 0;
}
.suggestions{
  position:absolute;
  top:38px;
  left:0;
  right:0;
  background:white;
  color:black;
  border-radius:5px;
  box-shadow:0 2px 6px rgba(0,0,0,0.2);
  z-index:10;
}
.suggestions div{
  padding:8px;
  cursor:pointer;
}
.suggestions div:hover{
  background:#eee;
}
.cart{
  background:#ff9900;
  padding:8px 12px;
  border-radius:5px;
  font-weight:bold;
  color:white;
}
.container{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));
  gap:15px;
  padding:20px;
}
.product{
  background:white;
  padding:10px;
  border-radius:10px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
  text-align:center;
}
.product img{
  width:100%;
  height:150px;
  object-fit:cover;
  border-radius:8px;
}
.product button{
  margin-top:8px;
  padding:6px 10px;
  background:#ff9900;
  border:none;
  color:white;
  border-radius:5px;
  cursor:pointer;
}
</style>
</head>
<body>

<header>
  <img src="logo.png" class="logo" alt="Logo">
  <div class="store-name">Kisan Agri Store</div>

  <div class="search-container">
    <div class="search-bar">
      <input type="text" id="searchBox" onkeyup="showSuggestions()" placeholder="Search products..." />
      <button onclick="searchProduct()">Search</button>
    </div>
    <div id="suggestions" class="suggestions"></div>
  </div>

  <div class="cart">Cart: <span id="cartCount">0</span></div>
</header>

<div class="container" id="productList">

  <div class="product" data-name="lunch box">
    <img src="images/lunchbox.jpg">
    <h3>Lunch Box</h3>
    <button onclick="addToCart()">Add to Cart</button>
  </div>

  <div class="product" data-name="bag">
    <img src="images/bag.jpg">
    <h3>School Bag</h3>
    <button onclick="addToCart()">Add to Cart</button>
  </div>

  <div class="product" data-name="mosquito racket">
    <img src="images/mosquito.jpg">
    <h3>Electric Mosquito Racket</h3>
    <button onclick="addToCart()">Add to Cart</button>
  </div>

  <div class="product" data-name="khurpi">
    <img src="images/khurpi.jpg">
    <h3>Khurpi (Garden Tool)</h3>
    <button onclick="addToCart()">Add to Cart</button>
  </div>

</div>

<script>
let cart = 0;

function addToCart(){
  cart++;
  document.getElementById("cartCount").innerText = cart;
}

function searchProduct(){
  let input = document.getElementById("searchBox").value.toLowerCase();
  let products = document.getElementsByClassName("product");

  for(let i=0;i<products.length;i++){
    let name = products[i].getAttribute("data-name");
    products[i].style.display = name.includes(input) ? "block" : "none";
  }
  document.getElementById("suggestions").innerHTML = "";
}

function showSuggestions(){
  let input = document.getElementById("searchBox").value.toLowerCase();
  let suggestionsBox = document.getElementById("suggestions");
  let items = ["lunch box","bag","mosquito racket","khurpi"];

  suggestionsBox.innerHTML = "";

  if(input === "") return;

  items.forEach(item => {
    if(item.includes(input)){
      let div = document.createElement("div");
      div.innerText = item;
      div.onclick = function(){
        document.getElementById("searchBox").value = item;
        suggestionsBox.innerHTML = "";
      }
      suggestionsBox.appendChild(div);
    }
  });
}
</script>

</body>
</html>
