<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Store</title>
<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f4f4f4;
}
header{
  background:#131921;
  color:white;
  display:flex;
  align-items:center;
  padding:10px 15px;
  gap:15px;
}
.logo{
  width:50px;
  height:50px;
  border-radius:8px;
  object-fit:cover;
}
.store-name{
  font-size:20px;
  font-weight:bold;
}
.search-bar{
  flex:1;
  display:flex;
}
.search-bar input{
  width:100%;
  padding:8px;
  border:none;
  border-radius:4px 0 0 4px;
}
.search-bar button{
  padding:8px 12px;
  border:none;
  background:#febd69;
  cursor:pointer;
  border-radius:0 4px 4px 0;
}
.container{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));
  gap:15px;
  padding:20px;
}
.product{
  background:white;
  padding:10px;
  border-radius:10px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
  text-align:center;
}
.product img{
  width:100%;
  height:150px;
  object-fit:cover;
  border-radius:8px;
}
.product h3{
  margin:10px 0 5px;
}
.product a{
  display:inline-block;
  margin-top:8px;
  padding:6px 10px;
  background:#ff9900;
  color:white;
  text-decoration:none;
  border-radius:5px;
}
</style>
</head>
<body>

<header>
  <!-- LOGO (replace src with your logo file) -->
  <img src="logo.png" class="logo" alt="Logo">

  <div class="store-name">My Web Store</div>

  <div class="search-bar">
    <input type="text" id="searchBox" placeholder="Search products..." />
    <button onclick="searchProduct()">Search</button>
  </div>
</header>

<div class="container" id="productList">

  <div class="product">
    <img src="images/lunchbox.jpg" alt="Lunch Box">
    <h3>Lunch Box</h3>
    <a href="#">Buy Now</a>
  </div>

  <div class="product">
    <img src="images/bag.jpg" alt="Bag">
    <h3>School Bag</h3>
    <a href="#">Buy Now</a>
  </div>

  <div class="product">
    <img src="images/mosquito.jpg" alt="Mosquito Killer">
    <h3>Electric Mosquito Racket</h3>
    <a href="#">Buy Now</a>
  </div>

  <div class="product">
    <img src="images/khurpi.jpg" alt="Khurpi">
    <h3>Khurpi (Garden Tool)</h3>
    <a href="#">Buy Now</a>
  </div>

</div>

<script>
function searchProduct() {
  let input = document.getElementById("searchBox").value.toLowerCase();
  let products = document.getElementsByClassName("product");

  for (let i = 0; i < products.length; i++) {
    let text = products[i].innerText.toLowerCase();
    products[i].style.display = text.includes(input) ? "block" : "none";
  }
}
</script>

</body>
</html>
